name: Release

# Publishes to npm and creates a GitHub Release only when a maintainer
# pushes a version tag (e.g. v1.6.1). Does not run on push to main/PRs.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "Tag $TAG does not match package.json version $EXPECTED"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build:cli

      - name: Publish to npm (provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v ver="$VERSION" '
            BEGIN { capturing = 0 }
            $0 ~ "^## \\[" ver "\\]" { capturing = 1; next }
            capturing && $0 ~ /^## \[/ { exit }
            capturing && $0 ~ /^\[/ { exit }
            capturing { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          {
            echo "## ShadPanel $VERSION"
            echo
            cat /tmp/release-notes.md
            echo
            echo "Full changelog: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md"
          } > /tmp/release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_file: /tmp/release-body.md
          draft: false
          prerelease: false
          generate_release_notes: false
